<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple Hello World page by Hyemin Lee." />
    <title>Hello World!</title>

    <style>
      /*
       * These variables keep the visual design in one place. To change the
       * page's colors or spacing later, update the values here first.
       */
      :root {
        --background: #f4f1ea;
        --surface: #fffdf8;
        --text: #1e2a24;
        --muted-text: #5f6b64;
        --accent: #d9683b;
        --accent-dark: #a94724;
        --border: #d9d4c8;
        --shadow: 0 24px 60px rgba(47, 58, 48, 0.12);
      }

      /* Reset the browser's default spacing so the layout is predictable. */
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 15%, rgba(217, 104, 59, 0.16), transparent 28%),
          linear-gradient(135deg, #f4f1ea 0%, #e9eee5 100%);
        font-family: Georgia, 'Times New Roman', serif;
      }

      /* The main content remains readable on both desktop and mobile screens. */
      .welcome-card {
        width: min(100%, 720px);
        padding: clamp(40px, 8vw, 88px);
        text-align: center;
        background: rgba(255, 253, 248, 0.94);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--accent-dark);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .author {
        margin: 28px 0 0;
        color: var(--muted-text);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        line-height: 1.5;
      }

      /* A small decorative line gives the page a clear visual endpoint. */
      .divider {
        width: 72px;
        height: 4px;
        margin: 32px auto 0;
        background: var(--accent);
        border-radius: 999px;
      }

      /* Respect visitors who prefer less motion in their operating system. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="welcome-card" aria-labelledby="page-title">
      <!-- This label is intentionally small; the requested title is the main focus. -->
      <p class="eyebrow">A new beginning</p>

      <!-- Edit this heading when you want to change the primary message. -->
      <h1 id="page-title">Hello World!</h1>

      <!-- Edit this paragraph when you want to change the author text. -->
      <p class="author">I'm Hyemin Lee</p>

      <div class="divider" aria-hidden="true"></div>
    </main>
  </body>
</html>
